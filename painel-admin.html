<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Painel Admin - BR RP</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="firebase.js"></script>

<style>
body { font-family: Arial; background: #eaf1ff; margin: 0; padding: 20px; }
h1 { color: #003060; }
.box { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; border-left: 6px solid #0050b8; }
input, button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 6px; border: 1px solid #004aad; }
button { background: #0050b8; color: white; font-weight: bold; border: none; cursor: pointer; }
button:hover { background: #003f8a; }
</style>
</head>

<body>

<h1>Painel do Administrador</h1>
<button onclick="logout()">Sair</button>

<div class="box">
    <h2>Criar Time</h2>
    <input id="nomeTime" placeholder="Nome do time">
    <input id="descTime" placeholder="Descrição">
    <input id="corTime" placeholder="Cor (ex: #004aad)">
    <button onclick="criarNovoTime()">Criar</button>
</div>

<div class="box">
    <h2>Adicionar dinheiro a um usuário</h2>
    <input id="uidAdd" placeholder="UID do usuário">
    <input id="valorAdd" placeholder="Valor (ex: 100)">
    <button onclick="addMoney()">Adicionar</button>
</div>

<script>
async function criarNovoTime() {
    let nome = document.getElementById("nomeTime").value;
    let desc = document.getElementById("descTime").value;
    let cor = document.getElementById("corTime").value;

    await criarTime(nome, desc, cor);
    alert("Time criado!");
}

async function addMoney() {
    let uid = document.getElementById("uidAdd").value;
    let valor = parseInt(document.getElementById("valorAdd").value);

    await adicionarSaldo(uid, valor);
    alert("Dinheiro adicionado!");
}
</script>

</body>
</html>
