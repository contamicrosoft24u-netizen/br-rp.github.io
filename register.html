<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Registrar - BR RP</title>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="firebase.js"></script>

    <style>
        body { font-family: Arial; background: #eaf1ff; margin: 0; }
        .box { max-width: 400px; margin: 80px auto; background: white; padding: 25px; border-radius: 10px; border-left: 6px solid #0050b8; }
        input, select, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: 1px solid #004aad; }
        button { background: #0050b8; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #003f8a; }
        h1 { text-align: center; color: #003060; }
        a { color: #0050b8; text-decoration: none; }
    </style>
</head>
<body>

<div class="box">
    <h1>Registrar</h1>

    <input id="nome" placeholder="Seu nome">
    <input id="email" placeholder="Email" type="email">
    <input id="senha" placeholder="Senha" type="password">

    <select id="tipo">
        <option value="jogador">Jogador</option>
        <option value="admin">Admin</option>
    </select>

    <button onclick="registrar()">Criar Conta</button>

    <p style="text-align:center;">
        Já tem conta? <a href="login.html">Entrar</a>
    </p>
</div>

<script>
async function registrar() {
    let nome = document.getElementById("nome").value;
    let email = document.getElementById("email").value;
    let senha = document.getElementById("senha").value;
    let tipo = document.getElementById("tipo").value;

    try {
        await registrarUsuario(email, senha, nome, tipo);
        alert("Conta criada com sucesso!");
        window.location = "login.html";

    } catch (e) {
        alert("Erro: " + e.message);
    }
}
</script>

</body>
</html>
