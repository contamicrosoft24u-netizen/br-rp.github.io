<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <title>Login - BR RP</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="firebase.js"></script>

    <style>
        body { font-family: Arial; background: #eaf1ff; margin: 0; }
        .box { max-width: 400px; margin: 80px auto; background: white; padding: 25px; border-radius: 10px; border-left: 6px solid #0050b8; }
        input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: 1px solid #004aad; }
        button { background: #0050b8; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #003f8a; }
        h1 { text-align: center; color: #003060; }
        a { color: #0050b8; text-decoration: none; }
    </style>
</head>
<body>

<div class="box">
    <h1>BR RP - Login</h1>

    <input id="email" placeholder="Email" type="email">
    <input id="senha" placeholder="Senha" type="password">
    <button onclick="logar()">Entrar</button>

    <p style="text-align:center;">
        Não tem conta? <a href="register.html">Registrar</a>
    </p>
</div>

<script>
async function logar() {
    let email = document.getElementById("email").value;
    let senha = document.getElementById("senha").value;

    try {
        const cred = await login(email, senha);
        const userData = await getUserData(cred.user.uid);

        if (!userData.exists) {
            alert("Usuário sem dados!");
            return;
        }

        const tipo = userData.data().tipo;

        if (tipo === "admin") {
            window.location = "painel-admin.html";
        } else {
            window.location = "painel-jogador.html";
        }

    } catch (e) {
        alert("Erro ao logar: " + e.message);
    }
}
</script>

</body>
</html>
