<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Painel Jogador - BR RP</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="firebase.js"></script>

<style>
body { font-family: Arial; background: #eaf1ff; margin: 0; padding: 20px; }
.box { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; border-left: 6px solid #0050b8; }
h1 { color: #003060; }
button { padding: 10px; border-radius: 6px; background: #0050b8; color: white; border: none; cursor: pointer; }
</style>
</head>

<body>

<h1>Painel do Jogador</h1>
<button onclick="logout()">Sair</button>

<div class="box" id="info"></div>
<div class="box" id="times"></div>
<div class="box" id="transacoes"></div>

<script>
auth.onAuthStateChanged(async user => {
    if (!user) return window.location = "login.html";

    const data = await getUserData(user.uid);
    const u = data.data();

    document.getElementById("info").innerHTML = `
        <h2>Suas informações</h2>
        <p><strong>Nome:</strong> ${u.nome}</p>
        <p><strong>Email:</strong> ${u.email}</p>
        <p><strong>Saldo:</strong> R$ ${u.saldo}</p>
    `;

    let timesSnap = await listarTimes();
    let htmlTimes = "<h2>Times</h2>";
    timesSnap.forEach(t => {
        let time = t.data();
        htmlTimes += `<p><strong>${time.nome}</strong> — ${time.descricao}</p>`;
    });
    document.getElementById("times").innerHTML = htmlTimes;

    let transSnap = await listarTransacoes(user.uid);
    let htmlT = "<h2>Transações</h2>";
    transSnap.forEach(t => {
        let d = t.data();
        htmlT += `<p>${d.tipo}: R$ ${d.valor}</p>`;
    });
    document.getElementById("transacoes").innerHTML = htmlT;
});
</script>

</body>
</html>
